[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "woliumcp"
version = "0.1.0"
description = "WoLiu-AI-Agent MCP 适配层 —— 插件化服务模块系统，一次编写，任意 MCP 客户端即插即用"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "WoLiu", email = "woliu@example.com" },
]
keywords = ["mcp", "agent", "woliu", "model-context-protocol", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["fastmcp>=3.0", "mcp>=1.2"]

[project.scripts]
woliumcp = "woliumcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
woliumcp = "src/woliumcp"
